name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/worker/pyproject.toml
            packages/schemas/pyproject.toml
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check src tests ../../packages/schemas/src
      - run: mypy src tests ../../packages/schemas/src
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  schema-contract:
    # The TypeScript types must match the Python models they're generated from.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install ./packages/schemas
      - run: python -m citebell_schemas.export packages/schemas/citebell.schema.json
      - run: npm ci && npm run gen:types
        working-directory: apps/web
      - run: git diff --exit-code -- packages/schemas/citebell.schema.json apps/web/src/lib/schemas.generated.ts
